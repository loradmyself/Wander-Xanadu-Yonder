# WXY platform · minimal bootable configuration.
# Everything not listed here falls back to the SDK defaults for SF32LB57X.

# --- 内核 ---
CONFIG_RT_MAIN_THREAD_STACK_SIZE=8192
CONFIG_RT_USING_MEMHEAP=y
CONFIG_RT_USING_SYSTEM_WORKQUEUE=y
CONFIG_RT_SYSTEM_WORKQUEUE_STACKSIZE=4096
CONFIG_RT_USING_OVERFLOW_CHECK=y
CONFIG_BSP_USING_FULL_ASSERT=y

# --- 日志 ---
CONFIG_RT_USING_ULOG=y
CONFIG_ULOG_LINE_BUF_SIZE=256
CONFIG_ULOG_OUTPUT_FLOAT=y

# --- 第一阶段先不启用 LCPU 补丁镜像，避免链接缺少 lcpu_img 符号 ---
# 蓝牙/双核协处理器启用时再打开，并补上 src/lcpu_img.c。
# CONFIG_BSP_USING_LCPU_PATCH is not set

# --- 子工程 ---
CONFIG_WXY_COMPUTE_ACPU=y
# CONFIG_WXY_TF_DFU is not set

# --- 双核：HCPU 侧需要 ACPU 控制框架与跨核队列 ---
CONFIG_BSP_USING_ACPU=y
CONFIG_USING_ACPU_CTRL_FWK=y
CONFIG_USING_IPC_QUEUE=y
