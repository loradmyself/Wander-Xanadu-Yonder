# CONFIG_BSP_USING_LCPU_PATCH is not set
CONFIG_RT_MAIN_THREAD_STACK_SIZE=8192
CONFIG_RT_USING_DFS_ELMFAT=y
CONFIG_RT_USING_SYSTEM_WORKQUEUE=y
CONFIG_RT_SYSTEM_WORKQUEUE_STACKSIZE=4096
CONFIG_RT_USING_ULOG=y
CONFIG_ULOG_LINE_BUF_SIZE=256
CONFIG_ULOG_OUTPUT_FLOAT=y
CONFIG_RT_USING_MEMHEAP=y
CONFIG_BSP_USING_FULL_ASSERT=y
CONFIG_USING_ACPU_CTRL_FWK=y
CONFIG_PKG_USING_LITTLEVGL2RTT=y
CONFIG_LVGL_V9=y
CONFIG_LV_USE_LOG=y
CONFIG_LV_USE_PERF_MONITOR=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_MONTSERRAT_28=y
CONFIG_LV_RTTHREAD_USE_PSRAM_PRIVATE_HEAP=y
CONFIG_LV_USE_SYSMON=y
CONFIG_LV_USE_PERF_MONITOR_LOG_MODE=y
# LB57 全核 M33（register.h __CM33_REV），无 Helium/MVE，禁止 armv8.1-m.main+mve 与 Helium 汇编
# LB57 无 EXTDMA 压缩外设，COMPRESSED 路径编不过；双全屏 fb 放 PSRAM，LVGL 保持 L1 单块 100 行
CONFIG_LCD_FB_USING_TWO_UNCOMPRESSED=y
CONFIG_LV_FB_ONE_NOT_SCREEN_SIZE=y
CONFIG_LV_FB_LINE_NUM=100
# SystemView 的 bss 占 33KB，会把系统堆挤到 ~149KB，触摸线程创建失败 -> tpread STKOF 死机
# CONFIG_PKG_USING_SYSTEMVIEW is not set
